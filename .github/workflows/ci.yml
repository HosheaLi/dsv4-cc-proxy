name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install ".[test]"

    - name: Run tests
      run: python -m pytest tests/ -v --cov=dsv4_cc_proxy --cov-report=term --cov-report=json

    - name: Generate coverage badge
      if: github.ref == 'refs/heads/main'
      run: python3 scripts/coverage-badge.py

    - name: Commit coverage badge
      if: github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add -f coverage.svg
        git diff --staged --quiet || git commit -m "chore: update coverage badge [skip ci]"
        git push

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install linting tools
      run: pip install ruff
    - name: Lint with ruff
      run: ruff check dsv4_cc_proxy/ tests/

  pages:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4
    - name: Setup Pages
      uses: actions/configure-pages@v5
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: "."
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  publish-github:
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Extract version from tag
      id: tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    # --- GitHub Release ---
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        name: v${{ steps.tag.outputs.VERSION }}

    # --- Homebrew Tap update ---
    - name: Update Homebrew Tap
      env:
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        set -euo pipefail
        VERSION="${{ steps.tag.outputs.VERSION }}"
        TARBALL_URL="https://github.com/HosheaLi/dsv4-cc-proxy/archive/refs/tags/v${VERSION}.tar.gz"

        # -f: HTTP 错误直接失败，避免把错误页的哈希写进 formula
        curl -fsSL "$TARBALL_URL" -o dsv4.tar.gz
        SHA256=$(shasum -a 256 dsv4.tar.gz | cut -d' ' -f1)

        git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/HosheaLi/homebrew-tap.git"
        sed -e "s|TARBALL_URL_PLACEHOLDER|${TARBALL_URL}|" \
            -e "s|SHA256_PLACEHOLDER|${SHA256}|" \
            .github/templates/dsv4-cc-proxy.rb > homebrew-tap/Formula/dsv4-cc-proxy.rb

        cd homebrew-tap
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Formula/dsv4-cc-proxy.rb
        if git diff --cached --quiet; then
          echo "formula 无变化，跳过提交"
        else
          git commit -m "dsv4-cc-proxy v${VERSION}"
          git push
        fi

    # --- Scoop bucket update ---
    - name: Update Scoop bucket
      env:
        HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        set -euo pipefail
        VERSION="${{ steps.tag.outputs.VERSION }}"
        ZIP_URL="https://github.com/HosheaLi/dsv4-cc-proxy/archive/refs/tags/v${VERSION}.zip"
        EXTRACT_DIR="dsv4-cc-proxy-${VERSION}"

        # -f: HTTP 错误直接失败，避免把错误页的哈希写进 manifest
        curl -fsSL "$ZIP_URL" -o dsv4.zip
        HASH=$(shasum -a 256 dsv4.zip | cut -d' ' -f1)

        git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/HosheaLi/scoop-bucket.git"
        sed -e "s|VERSION_PLACEHOLDER|${VERSION}|" \
            -e "s|ZIP_URL_PLACEHOLDER|${ZIP_URL}|" \
            -e "s|EXTRACT_DIR_PLACEHOLDER|${EXTRACT_DIR}|" \
            -e "s|HASH_PLACEHOLDER|${HASH}|" \
            .github/templates/dsv4-cc-proxy.json > scoop-bucket/dsv4-cc-proxy.json

        cd scoop-bucket
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add dsv4-cc-proxy.json
        if git diff --cached --quiet; then
          echo "manifest 无变化，跳过提交"
        else
          git commit -m "dsv4-cc-proxy v${VERSION}"
          git push
        fi

  publish-docker:
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Extract version from tag
      id: tag
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

    # --- Docker publish (Docker Hub + GHCR) ---
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          hosheali/dsv4-cc-proxy
          ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}

    # --- Post-publish verification ---
    - name: Verify docker image
      run: |
        docker run -d -p 16889:16889 --name verify-proxy hosheali/dsv4-cc-proxy:latest
        sleep 3
        curl -f http://localhost:16889/health
        docker stop verify-proxy

  publish-pypi:
    runs-on: ubuntu-latest
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install build tools
      run: pip install build

    # --- PyPI publish (token auth) ---
    - name: Build sdist & wheel
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        print-hash: true

    # --- Post-publish verification ---
    - name: Verify pip install
      if: success()
      run: |
        pip install dsv4-cc-proxy
